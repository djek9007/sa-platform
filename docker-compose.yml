version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: sa-platform-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sa_platform
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sa_platform
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa_platform -d sa_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sa-platform-app
    restart: unless-stopped
    volumes:
      - ../sa-course:/app/sa-course
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://sa_platform:${DB_PASSWORD}@postgres:5432/sa_platform
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - COURSE_PATH=/app/sa-course
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true

volumes:
  postgres_data:
